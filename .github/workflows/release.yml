name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tag matches the package version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) echo "run this workflow from a v* tag, got $tag"; exit 1;; esac
          version="$(node -p "require('./package.json').version")"
          [ "$tag" = "v$version" ] || { echo "tag $tag but package.json is at $version"; exit 1; }
          case "$version" in *-*) prerelease=true;; *) prerelease=false;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test --if-present

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already on the registry"
          elif [ "$PRERELEASE" = true ]; then
            npm publish --provenance --access public --tag rc
          else
            npm publish --provenance --access public
          fi

  pages:
    needs: publish
    if: needs.publish.outputs.prerelease == 'false'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
