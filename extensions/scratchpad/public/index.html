<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratchpads</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<script src="/vendor/claude-hub-sdk.js"></script>
<aside id="list" aria-label="Scratchpads">
  <header><h1>Scratchpads</h1></header>
  <nav id="groups"></nav>
  <section id="running-section" hidden>
    <h2>Running viewers</h2>
    <ul id="running"></ul>
  </section>
</aside>
<main id="main">
  <div id="empty" class="note">
    <p>No pad open.</p>
    <p class="muted">Open a scratchpad from Kanban (click a linked <code>scratchpad.json</code>), or pick one from the list.</p>
  </div>
  <div id="error" class="note" hidden></div>
  <iframe id="viewer" title="Scratchpad" hidden></iframe>
</main>
<script src="app.js"></script>
</body>
</html>
