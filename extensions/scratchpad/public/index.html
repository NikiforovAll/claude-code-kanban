<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratchpads</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<script src="/vendor/claude-hub-sdk.js"></script>
<aside id="list" aria-label="Scratchpads">
  <header><h1>Scratchpads</h1><span id="count"></span></header>
  <nav id="groups"></nav>
</aside>
<main id="main">
  <header id="bar"><button id="back" type="button">‹ Pads</button></header>
  <div id="empty">
    <div class="home">
      <aside class="home-hero" aria-hidden="true">
        <svg viewBox="0 0 150 160">
          <rect class="sheet" x="30" y="26" width="96" height="120" rx="6" transform="rotate(-10 78 86)"/>
          <rect class="sheet" x="24" y="20" width="96" height="120" rx="6" transform="rotate(5 72 80)"/>
          <rect class="sheet" x="18" y="14" width="96" height="120" rx="6"/>
          <rect class="ink accent" x="30" y="30" width="50" height="6" rx="3"/>
          <rect class="ink" x="30" y="46" width="72" height="4" rx="2"/>
          <rect class="ink" x="30" y="56" width="58" height="4" rx="2"/>
          <rect class="ink" x="30" y="66" width="68" height="4" rx="2"/>
          <rect class="figure" x="30" y="82" width="72" height="38" rx="3"/>
          <path class="ink-line" d="M36 112 L52 98 L64 106 L80 90 L96 100"/>
        </svg>
        <p id="home-stat"></p>
      </aside>
      <header class="home-head">
        <h2 id="home-title"></h2>
        <p id="home-sub" class="muted"></p>
      </header>
      <div id="no-scratch" class="callout" hidden>
        <strong>The <code>scratch</code> CLI is not on PATH, so pads cannot open.</strong>
        <span>Install it with <code>bun add -g @nikiforovall/scratchpad</code>, then reload this page. No restart needed.</span>
      </div>
      <section id="recent" hidden>
        <h3>Recent</h3>
        <ul id="cards"></ul>
      </section>
      <section id="actions">
        <h3>Quick actions</h3>
        <div id="action-buttons"></div>
        <form id="open-form" autocomplete="off">
          <label for="open-path">Open a folder</label>
          <div class="field">
            <input id="open-path" type="text" spellcheck="false" placeholder="Pad folder or its scratchpad.json">
            <button type="submit">Open</button>
          </div>
          <p id="open-error" role="alert" hidden></p>
        </form>
      </section>
      <section class="keys">
        <h3>Keys</h3>
        <dl>
          <dt><kbd>\</kbd></dt><dd>Hide or show the list</dd>
        </dl>
      </section>
    </div>
  </div>
  <div id="error" class="note" hidden></div>
  <iframe id="viewer" title="Scratchpad" hidden></iframe>
</main>
<script src="app.js"></script>
</body>
</html>
